name: JeshlaAutoAI CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  LLM_PROVIDER: groq
  GROQ_API_KEY: fixture-key-not-real
  GROQ_MODEL: fixture-model
  AI_DEPLOYMENT_MODE: hosted
  LLM_ALLOW_LOCAL_OLLAMA: "false"
  LLM_FALLBACK_ENABLED: "false"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: Offline Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install core and RAG test dependencies
        run: python -m pip install -r requirements-rag.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run guarded offline tests
        env:
          JESHLA_HOME: ${{ runner.temp }}/jeshla-offline-state
        run: python tests/run_offline.py
      - name: Upload test progress on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: offline-test-progress
          path: outputs/logs/offline-tests-*.jsonl
          if-no-files-found: ignore
          retention-days: 7

  startup:
    name: Offline ${{ matrix.interface }} startup
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        interface: [console, browser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install core dependencies
        run: python -m pip install -r requirements-core.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Verify actual startup with isolated state and blocked live calls
        run: python -m evaluations.ci_smoke --interface ${{ matrix.interface }} --output-dir outputs/ci/${{ matrix.interface }}
      - name: Upload scoped startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-${{ matrix.interface }}
          path: outputs/ci/${{ matrix.interface }}/
          if-no-files-found: ignore
          retention-days: 7
