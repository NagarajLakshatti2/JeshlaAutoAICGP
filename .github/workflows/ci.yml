name: JeshlaAutoAI CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:          # allows manual "Run workflow" from GitHub UI

# ── Shared env visible to every job ─────────────────────────────────────────
env:
  PYTHON_VERSION: "3.14"
  LLM_PROVIDER: "groq"        # fake provider used in offline tests

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # 1. OFFLINE TEST SUITE  (runs tests/run_offline.py – no live LLM needed)
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Offline Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install core dependencies
        run: pip install -r requirements-core.txt

      - name: Write minimal .env for offline tests
        # Real secrets are NOT needed for offline tests; stubs satisfy dotenv loads.
        run: |
          cat > .env <<'EOF'
          LLM_PROVIDER=groq
          GROQ_API_KEY=test-stub
          GROQ_MODEL=llama-3.3-70b-versatile
          ANTHROPIC_API_KEY=test-stub
          OPENROUTER_API_KEY=test-stub
          OPENROUTER_MODEL=nvidia/nemotron-3-super-120b-a12b:free
          GEMINI_MODEL=gemini-2.0-flash
          JIRA_SITE_URL=https://example.atlassian.net
          JIRA_PROJECT_KEY=TEST
          JIRA_ALLOW_CREATE=false
          AI_MAX_STEPS=10
          AI_MAX_CONVERSATION_CHARS=8000
          EOF

      - name: Run offline test suite
        run: python tests/run_offline.py

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            outputs/
            *.log


  # ─────────────────────────────────────────────────────────────────────────
  # 2. STREAMLIT SMOKE CHECK  (confirms the app imports and page renders)
  # ─────────────────────────────────────────────────────────────────────────
  streamlit-smoke:
    name: Streamlit Smoke Check
    runs-on: ubuntu-latest
    needs: test             # only run if tests pass

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install core dependencies
        run: pip install -r requirements-core.txt

      - name: Write minimal .env
        run: |
          cat > .env <<'EOF'
          LLM_PROVIDER=groq
          GROQ_API_KEY=test-stub
          GROQ_MODEL=llama-3.3-70b-versatile
          ANTHROPIC_API_KEY=test-stub
          OPENROUTER_API_KEY=test-stub
          OPENROUTER_MODEL=nvidia/nemotron-3-super-120b-a12b:free
          GEMINI_MODEL=gemini-2.0-flash
          JIRA_SITE_URL=https://example.atlassian.net
          JIRA_PROJECT_KEY=TEST
          JIRA_ALLOW_CREATE=false
          AI_MAX_STEPS=10
          AI_MAX_CONVERSATION_CHARS=8000
          EOF

      - name: Verify streamlit_app.py imports cleanly
        # Streamlit can't open a real browser in CI, but `streamlit run --server.headless true`
        # with a short timeout confirms the module loads without import errors.
        run: |
          timeout 20 streamlit run streamlit_app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            --logger.level error \
          || EXIT=$?
          # exit code 124 = timeout (app was still running) → that is a PASS
          # any other non-zero code = real error
          if [ "${EXIT:-0}" -ne 0 ] && [ "${EXIT:-0}" -ne 124 ]; then
            echo "Streamlit exited with error code $EXIT"
            exit 1
          fi
          echo "Streamlit smoke check passed."


  # ─────────────────────────────────────────────────────────────────────────
  # 3. LANGGRAPH AGENT SMOKE CHECK  (imports the graph, runs one offline turn)
  # ─────────────────────────────────────────────────────────────────────────
  langgraph-smoke:
    name: LangGraph Agent Smoke Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install core dependencies
        run: pip install -r requirements-core.txt

      - name: Write minimal .env
        run: |
          cat > .env <<'EOF'
          LLM_PROVIDER=groq
          GROQ_API_KEY=test-stub
          GROQ_MODEL=llama-3.3-70b-versatile
          ANTHROPIC_API_KEY=test-stub
          OPENROUTER_API_KEY=test-stub
          OPENROUTER_MODEL=nvidia/nemotron-3-super-120b-a12b:free
          GEMINI_MODEL=gemini-2.0-flash
          JIRA_SITE_URL=https://example.atlassian.net
          JIRA_PROJECT_KEY=TEST
          JIRA_ALLOW_CREATE=false
          AI_MAX_STEPS=10
          AI_MAX_CONVERSATION_CHARS=8000
          EOF

      - name: Verify agent graph imports and compiles
        run: |
          python - <<'PYEOF'
          import os, sys
          # Confirm the graph builds (no live LLM call is made at import time)
          from agent.langgraph.langgraph_agent import graph, LLM_PROVIDER
          print(f"Graph compiled OK | provider from env: {LLM_PROVIDER}")
          # Verify the entry-point script is callable
          import importlib.util
          spec = importlib.util.spec_from_file_location("agent_main", "agent/langgraph/langgraph_agent.py")
          assert spec is not None, "Could not locate langgraph_agent.py"
          print("LangGraph agent entry-point located successfully.")
          PYEOF


  # ─────────────────────────────────────────────────────────────────────────
  # 4. STORE REAL API KEYS AS GITHUB SECRETS  (reminder block – read notes)
  # ─────────────────────────────────────────────────────────────────────────
  # To add your real keys:
  #   GitHub repo → Settings → Secrets and variables → Actions → New secret
  #
  #   Secret name          .env variable
  #   ─────────────────    ─────────────────────────
  #   GROQ_API_KEY         GROQ_API_KEY
  #   OPENROUTER_API_KEY   OPENROUTER_API_KEY
  #   ANTHROPIC_API_KEY    ANTHROPIC_API_KEY
  #   GEMINI_API_KEY       GOOGLE_AI_STUDEO_KEY
  #   SERPAPI_KEY          SERPAPI_KEY
  #   JIRA_SITE_URL        JIRA_SITE_URL
  #
  # Then replace the stub values above with:
  #   GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
  # etc.  Never commit real keys to the repo.
