[theme]
base = "light"
primaryColor = "#087f8c"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7f9"
textColor = "#172033"
borderColor = "#dce2e8"
baseRadius = "large"
buttonRadius = "large"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#f5f7f9"
secondaryBackgroundColor = "#e4f2f4"

# Keep native Rerun and Auto rerun under the options menu.
[client]
toolbarMode = "developer"

# Detect source updates; each browser can enable Auto rerun from the menu.
[server]
fileWatcherType = "auto"
